<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RandomQuote Generator</title>
        <style>
  body {
    font-family: Arial, sans-serif;
    max-width: 650px;
    margin: 80px auto;
    padding: 0 20px;
    text-align: center;
    background: #f4f7fb;
  }

  h1 {
    color: #1f2937;
  }

  #quoteText {
    min-height: 70px;
    padding: 25px;
    background: white;
    border-radius: 12px;
    font-size: 1.25rem;
    line-height: 1.6;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  }

  #quoteAuthor {
    min-height: 24px;
    color: #4b5563;
    font-style: italic;
  }

  button {
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }

  button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
</style>
    </head>
    <body>
        <h1>Random Quote Generator</h1>

        <p id="quoteText">Click the button for aquote.</p>
        <p id="quoteAuthor"></p>

        <button id="newQuoteButton">Get New Quote</button>

        <script src="script.js"></script>
    </body>
</html>
