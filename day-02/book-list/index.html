<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Book List</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    max-width: 650px;
    margin: 40px auto;
    padding: 0 20px;
  }

  input,
  button {
    padding: 10px;
    margin: 5px 0;
  }

  #bookList {
    padding: 0;
  }

  #bookList li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px;
    margin-top: 8px;
    background-color: #f3f4f6;
    list-style: none;
  }
  </style>
</head>
<body>
  <h1>My Books</h1>
  <p id="bookCount"></p>

  <form id="bookForm">
  <input id="titleInput" type="text" placeholder="Book title" />
  <input id="authorInput" type="text" placeholder="Author name" />
  <input id="yearInput" type="number" placeholder="Year" />
  <button type="submit">Add Book</button>
  </form>
  <input id="searchInput" type="text" placeholder="Search books..." />

  <ul id="bookList"></ul>

  <script src="script.js"></script>
</body>
</html>
