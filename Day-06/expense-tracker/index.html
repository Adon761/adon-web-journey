<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <p>Track balance, log income/expenses, and manage budget state</p>
    </header>

    <!-- Balance & Summary Cards -->
    <section class="summary-card">
      <div class="balance-container">
        <span>Your Total Balance</span>
        <h2 id="balance">₹0.00</h2>
      </div>
      <div class="inc-exp-container">
        <div class="inc-card">
          <h4>Income</h4>
          <p id="money-plus" class="money plus">+₹0.00</p>
        </div>
        <div class="exp-card">
          <h4>Expenses</h4>
          <p id="money-minus" class="money minus">-₹0.00</p>
        </div>
      </div>
    </section>

    <!-- Add Transaction Form -->
    <section class="form-section">
      <h3>Add New Transaction</h3>
      <form id="form">
        <div class="form-control">
          <label for="text">Description</label>
          <input type="text" id="text" placeholder="e.g., Domain Registration, Freelance Payment..." required />
        </div>
        
        <div class="form-row">
          <div class="form-control">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g., 1500" step="any" required />
          </div>
          
          <div class="form-control">
            <label for="type">Type</label>
            <select id="type">
              <option value="income">Income (+)</option>
              <option value="expense">Expense (-)</option>
            </select>
          </div>
        </div>

        <button class="btn">Add Transaction</button>
      </form>
    </section>

    <!-- History / Transaction List -->
    <section class="history-section">
      <div class="history-header">
        <h3>History</h3>
        <select id="filter" onchange="filterTransactions()">
          <option value="all">All</option>
          <option value="income">Income</option>
          <option value="expense">Expenses</option>
        </select>
      </div>
      
      <ul id="list" class="list">
        <!-- Dynamic Items Will Render Here -->
      </ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
