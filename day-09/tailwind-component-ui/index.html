<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 9: Tailwind CSS Component Architecture</title>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Custom Tailwind Configuration
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- Top Navigation Component Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-2">
          <span class="h-3 w-3 rounded-full bg-brand-500 animate-pulse"></span>
          <h1 class="text-2xl font-bold tracking-tight text-white">SaaS Analytics Component Engine</h1>
        </div>
        <p class="text-sm text-slate-400 mt-1">Day 09: Utility-First Architecture & Component Extraction</p>
      </div>

      <div class="flex items-center gap-3">
        <button id="filter-all-btn" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-brand-600 text-white shadow-sm hover:bg-brand-500 transition">
          All Systems
        </button>
        <button id="filter-active-btn" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 hover:text-white transition">
          Active Node
        </button>
      </div>
    </header>

    <!-- Analytics Stats Grid Container (Populated via JavaScript Component Engine) -->
    <section>
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-4">Core Telemetry</h2>
      <div id="stats-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </section>

    <!-- Main Content Dual-Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left Column: Feature Cards Grid (2 Cols wide) -->
      <section class="lg:col-span-2 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Active Services</h2>
          <span class="text-xs text-slate-500">Auto-refreshing via Component State</span>
        </div>
        <div id="services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- Right Column: Interactive Control Panel Component -->
      <aside class="space-y-4">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">System Controller</h2>
        
        <div class="p-5 bg-slate-900 border border-slate-800 rounded-2xl space-y-4 shadow-xl">
          <div class="space-y-1">
            <h3 class="text-sm font-semibold text-white">Deploy Component</h3>
            <p class="text-xs text-slate-400">Simulate adding a new service card into state.</p>
          </div>

          <form id="add-service-form" class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Service Name</label>
              <input type="text" id="service-name" required placeholder="e.g. Auth Microservice" 
                     class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 transition">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Endpoint Path</label>
              <input type="text" id="service-path" required placeholder="e.g. /api/v1/auth" 
                     class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 transition">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
              <select id="service-status" 
                      class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-brand-500 transition">
                <option value="Operational">Operational</option>
                <option value="Degraded">Degraded</option>
                <option value="Maintenance">Maintenance</option>
              </select>
            </div>

            <button type="submit" 
                    class="w-full py-2.5 px-4 text-xs font-semibold bg-brand-600 text-white rounded-lg hover:bg-brand-500 active:scale-[0.98] transition-all shadow-lg shadow-brand-600/20">
              + Inject Component
            </button>
          </form>
        </div>
      </aside>

    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
